name: Build GLM 5.3 image

on:
  push:
    branches:
      - glm53-pr-53906
  workflow_dispatch:
    inputs:
      runner:
        description: Runner used for the CUDA image build
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - self-hosted

permissions:
  contents: read
  packages: write

concurrency:
  group: build-glm53-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim hosted-runner disk space
        if: github.event_name == 'push' || inputs.runner == 'ubuntu-24.04'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: vllm-openai
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:glm53-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            CUDA_VERSION=13.0.3
            torch_cuda_arch_list=10.0
            max_jobs=2
            nvcc_threads=2
            VLLM_BUILD_COMMIT=${{ github.sha }}
            VLLM_BUILD_PIPELINE=github-actions
            VLLM_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            VLLM_IMAGE_TAG=${{ env.IMAGE }}:glm53-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image reference
        run: |
          echo '### GLM 5.3 image' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.IMAGE }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
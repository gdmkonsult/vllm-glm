name: Build GLM 5.3 image

on:
  push:
    branches:
      - glm53-pr-53906
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Parallel compiler jobs (0 selects automatically)
        required: true
        default: "0"
        type: string
      nvcc_threads:
        description: Threads per NVCC process
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-glm53-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select build parallelism
        id: resources
        env:
          REQUESTED_MAX_JOBS: ${{ inputs.max_jobs || '0' }}
        run: |
          cpu_jobs=$(( $(nproc) - 2 ))
          memory_jobs=$(( $(awk '/MemTotal/ {print int($2 / 1024 / 1024)}' /proc/meminfo) / 4 ))
          auto_jobs=$(( cpu_jobs < memory_jobs ? cpu_jobs : memory_jobs ))
          (( auto_jobs < 2 )) && auto_jobs=2
          max_jobs="$REQUESTED_MAX_JOBS"
          [[ "$max_jobs" =~ ^[0-9]+$ ]] || { echo "max_jobs must be an integer" >&2; exit 1; }
          (( max_jobs == 0 )) && max_jobs="$auto_jobs"
          echo "max_jobs=$max_jobs" >> "$GITHUB_OUTPUT"
          echo "Using $max_jobs compiler jobs on $(nproc) CPUs" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          name: glm53-builder
          keep-state: true
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "{{defaultContext}}"
          file: docker/Dockerfile
          target: vllm-openai
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:glm53-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            CUDA_VERSION=13.0.3
            torch_cuda_arch_list=10.0
            ep_cuda_arch_list=10.0a
            VLLM_BUILD_FLASH_ATTN_2=false
            VLLM_BUILD_FLASH_ATTN_3=false
            RUN_WHEEL_CHECK=false
            max_jobs=${{ steps.resources.outputs.max_jobs }}
            nvcc_threads=${{ inputs.nvcc_threads || '1' }}
            VLLM_BUILD_COMMIT=${{ github.sha }}
            VLLM_BUILD_PIPELINE=github-actions
            VLLM_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            VLLM_IMAGE_TAG=${{ env.IMAGE }}:glm53-${{ github.sha }}
          cache-from: type=gha

      - name: Publish image reference
        run: |
          echo '### GLM 5.3 image' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.IMAGE }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"